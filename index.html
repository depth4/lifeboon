<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lifeboon — built one mechanic at a time</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #bfd0dc; }
      #viewport { display: block; width: 100%; height: 100%; touch-action: none; }
      .bar {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: flex; gap: 1rem; align-items: center; justify-content: space-between;
        padding: 0.6rem 1rem;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #22262b; background: rgba(255,255,255,0.82);
        backdrop-filter: blur(6px);
      }
      .bar a { color: #22262b; }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div class="bar">
      <span id="caption">Loading…</span>
      <a href="./frozen/">the old city →</a>
    </div>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
